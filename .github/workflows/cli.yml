name: CLI

on:
  push:
    paths:
      - "cli/**"
      - ".github/workflows/cli.yml"
  pull_request:
    paths:
      - "cli/**"
      - ".github/workflows/cli.yml"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.10"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: cli/pyproject.toml
      - name: Install base CLI
        run: python -m pip install -e . pytest
      - name: Test base CLI
        run: python -m pytest -q -p no:cacheprovider tests

  chart-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: cli/pyproject.toml
      - name: Install CLI with charts
        run: python -m pip install -e ".[charts]"
      - name: Render smoke chart
        run: |
          python - <<'PY'
          from pathlib import Path
          from autumn_cli.utils.charts import render_pie_chart

          output = Path("chart-smoke.png")
          render_pie_chart(
              [{"name": "Autumn", "total_time": 60}],
              save_path=str(output),
          )
          assert output.stat().st_size > 0
          PY
